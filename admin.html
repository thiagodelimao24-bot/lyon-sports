<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administrador | Lyon Sports
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="admin-body">


<header class="admin-header">

    <div
        class="container
        admin-header-content"
    >


        <div class="admin-brand">

            <img
                src="img/logo.png"
                alt="Lyon Sports"
            >


            <div>

                <strong>
                    LYON SPORTS
                </strong>

                <div>
                    Painel Administrativo
                </div>

            </div>

        </div>


        <div class="admin-actions">

            <a
                href="index.html"
                target="_blank"
            >

                Ver loja

            </a>


            <button
                onclick="logout()"
            >

                Sair

            </button>

        </div>

    </div>

</header>



<main class="admin-main">

<div class="container">


    <div class="admin-title">

        <h1>
            Gerenciar camisas
        </h1>

        <p>

            Cadastre, edite e exclua
            produtos da Lyon Sports.

        </p>

    </div>



    <div class="admin-layout">


        <!-- FORMULÁRIO -->

        <section class="admin-card">


            <h2 id="form-title">
                Nova camisa
            </h2>


            <form id="product-form">


                <input
                    type="hidden"
                    id="product-id"
                >


                <div class="form-group">

                    <label>
                        NOME
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        placeholder="Ex: Real Madrid 2026"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        CATEGORIA
                    </label>


                    <select
                        id="product-category"
                        required
                    >

                        <option
                            value="Brasileira"
                        >
                            Brasileira
                        </option>

                        <option
                            value="Europeia"
                        >
                            Europeia
                        </option>

                        <option
                            value="Seleção"
                        >
                            Seleção
                        </option>

                        <option
                            value="Retrô"
                        >
                            Retrô
                        </option>

                    </select>

                </div>


                <div class="form-group">
                    <label>TIME / SELEÇÃO</label>
                    <input type="text" id="product-club" placeholder="Ex: Juventus">
                </div>

                <div class="form-group">
                    <label>TEMPORADA</label>
                    <input type="text" id="product-season" placeholder="Ex: 2026/27">
                </div>

                <div class="form-group">
                    <label>QUALIDADE / LINHA</label>
                    <input type="text" id="product-quality" value="Qualidade Tailandesa" placeholder="Ex: Qualidade Tailandesa">
                </div>

                <div class="form-group">

                    <label>
                        PREÇO
                    </label>

                    <input
                        type="number"
                        id="product-price"
                        step="0.01"
                        min="0"
                        value="122.99"
                        required
                    >

                </div>


                <div class="form-group">
                    <label>FOTO DA CAMISA</label>
                    <div class="image-drop-zone" id="image-drop-zone" tabindex="0">
                        <input type="file" id="product-image-file" accept="image/png,image/jpeg,image/webp" multiple hidden>
                        <div class="drop-icon">⬆</div>
                        <strong>Arraste várias fotos aqui</strong>
                        <span>ou</span>
                        <button type="button" class="select-image-btn" id="select-image-btn">SELECIONAR VÁRIAS FOTOS</button>
                        <button type="button" class="select-image-btn" id="add-more-images-btn">+ ADICIONAR MAIS FOTOS</button>
                        <small>PNG, JPG ou WEBP • você pode selecionar várias juntas ou adicionar uma por vez</small>
                    </div>
                    <div class="multi-image-preview" id="multi-image-preview"></div>
                    <input type="hidden" id="product-image" required>
                    <input type="hidden" id="product-gallery">
                    <input type="url" id="product-image-url" placeholder="Ou cole uma URL de imagem (opcional)">
                </div>


                <div class="form-group">

                    <label>
                        TAMANHOS
                    </label>

                    <input
                        type="text"
                        id="product-sizes"
                        value="P,M,G,GG"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-save"
                >

                    SALVAR PRODUTO

                </button>

            </form>

        </section>



        <!-- PRODUTOS -->

        <section class="admin-card">

            <h2>
                Produtos cadastrados
            </h2>


            <div id="admin-products">
            </div>

        </section>

    </div>

</div>

</main>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>

</body>

</html>
